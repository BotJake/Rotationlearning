<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>RS3 Rotation Board</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <div id="topbar">
    <b>RS3 Rotation Board</b>
    <button id="toggleMode">Overlay view</button>
    <label>Icon <input id="iconSize" type="range" min="28" max="64" value="42"></label>
    <label><input id="showNames" type="checkbox"> names</label>
  </div>

  <section id="liveSection">
    <div class="sectionTitle">ACTIVE ROTATIONS</div>
    <div id="liveBoard"></div>
  </section>

  <div id="editor">
    <section class="panel">
      <div class="sectionTitle">PRESETS</div>
      <div class="presetCreate">
        <input id="newPresetName" placeholder="New preset name">
        <button id="newPreset">+ New</button>
      </div>
      <div id="presetList"></div>
      <div class="hint">✓ Show = rodyti viršuje. Gali būti aktyvūs keli presetai vienu metu.</div>
    </section>

    <section class="panel">
      <div class="sectionTitle">EDITING: <span id="editingName"></span></div>
      <div id="editStrip"></div>
      <div class="editActions">
        <input id="pauseTicks" type="number" min="1" max="100" value="8">
        <button id="addPause">+ Ⅱ Pause</button>
        <button id="clearPreset">Clear</button>
      </div>
      <div class="hint">Ability: click bibliotekoje → prideda į galą. Viršuje drag → perstumia. Right-click → ištrina. Pause double-click → pakeičia ticks.</div>
    </section>

    <section class="panel">
      <div class="sectionTitle">ABILITY LIBRARY</div>
      <div class="pickerbar">
        <select id="category"></select>
        <input id="search" placeholder="Search ability / special...">
      </div>
      <div id="picker"></div>
    </section>
  </div>
</div>

<script>
if (window.alt1 && typeof window.alt1.identifyAppUrl === "function") {
  window.alt1.identifyAppUrl("./appconfig.json");
}
</script>
<script src="app.js"></script>
</body>
</html>
